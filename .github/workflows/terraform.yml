name: Terraform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt check
        run: |
          terraform -chdir=terraform/aws fmt -check -recursive
          terraform -chdir=terraform/azure fmt -check -recursive
          terraform -chdir=terraform/gcp fmt -check -recursive

      - name: Terraform validate AWS
        run: |
          terraform -chdir=terraform/aws init -backend=false
          terraform -chdir=terraform/aws validate

      - name: Terraform validate Azure
        run: |
          terraform -chdir=terraform/azure init -backend=false
          terraform -chdir=terraform/azure validate

      - name: Terraform validate GCP
        run: |
          terraform -chdir=terraform/gcp init -backend=false
          terraform -chdir=terraform/gcp validate
